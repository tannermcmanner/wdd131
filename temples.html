<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Temple album page showcasing beautiful temple photography with a responsive mobile-first design."
    />
    <meta name="author" content="Tanner McNatt" />
    <title>Temple Album</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/temples.css" />
    <link rel="stylesheet" href="styles/temples-large.css" media="(min-width: 700px)" />
    <script src="scripts/temples.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="title-bar">
        <h2>Temple Album</h2>
      </div>
      <nav class="primary-nav" aria-label="Primary navigation">
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="nav-menu"
          aria-label="Toggle navigation menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div id="nav-menu" class="nav-menu">
          <a href="#">Home</a>
          <a href="#">Old</a>
          <a href="#">New</a>
          <a href="#">Large</a>
          <a href="#">Small</a>
        </div>
      </nav>
    </header>

    <main>
      <h1>Temple Highlights</h1>

      <div class="gallery" aria-label="Temple photo gallery">
        <figure>
          <img src="images/san-antonio-temple.jpg" alt="San Antonio Temple" />
          <figcaption>San Antonio Temple</figcaption>
        </figure>
        <figure>
          <img src="images/san-antonio-temple.jpg" alt="Salt Lake Temple" />
          <figcaption>Salt Lake Temple</figcaption>
        </figure>
        <figure>
          <img src="images/san-antonio-temple.jpg" alt="Nauvoo Temple" />
          <figcaption>Nauvoo Temple</figcaption>
        </figure>
        <figure>
          <img src="images/san-antonio-temple.jpg" alt="Paris Temple" />
          <figcaption>Paris Temple</figcaption>
        </figure>
        <figure>
          <img src="images/san-antonio-temple.jpg" alt="Laie Temple" />
          <figcaption>Laie Temple</figcaption>
        </figure>
        <figure>
          <img src="images/san-antonio-temple.jpg" alt="Provo Temple" />
          <figcaption>Provo Temple</figcaption>
        </figure>
        <figure>
          <img src="images/san-antonio-temple.jpg" alt="Jordan River Temple" />
          <figcaption>Jordan River Temple</figcaption>
        </figure>
        <figure>
          <img src="images/san-antonio-temple.jpg" alt="Mesa Temple" />
          <figcaption>Mesa Temple</figcaption>
        </figure>
        <figure>
          <img src="images/san-antonio-temple.jpg" alt="Boise Temple" />
          <figcaption>Boise Temple</figcaption>
        </figure>
      </div>
    </main>

    <footer>
      <p>&copy; <span id="currentyear"></span> Tanner McNatt | Utah</p>
      <p id="lastModified"></p>
    </footer>
  </body>
</html>
